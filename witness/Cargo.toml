[package]
name = "allowly-witness-poc"
version = "0.1.1"
edition = "2024"
publish = false

[dependencies]
tlsn = { path = "vendor/tlsn/crates/tlsn", features = ["mozilla-certs"] }
tlsn-attestation = { path = "vendor/tlsn/crates/attestation" }
tlsn-server-fixture = { path = "vendor/tlsn/crates/server-fixture/server" }
tlsn-server-fixture-certs = { path = "vendor/tlsn/crates/server-fixture/certs" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures = "0.3"
hex = "0.4"
httparse = "1"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[profile.release]
opt-level = 2
debug = 0
