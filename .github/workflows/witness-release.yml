name: Release experimental Witness helper

on:
  push:
    tags: ["witness-v*"]

permissions:
  contents: read

concurrency:
  group: witness-release-${{ github.ref }}

jobs:
  build:
    name: Native helper (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    env:
      NATIVE_TARGET: ${{ matrix.target }}
      RELEASE_DIR: ${{ github.workspace }}/witness/dist
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require clean version tag on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          python3 -c 'import os, sys; sys.path.insert(0, "witness/scripts"); import package_helper as p; p.require_release_source(); assert os.environ["GITHUB_REF_NAME"] == "witness-v" + p.cargo_version()'
      - name: Install pinned native Rust toolchain
        working-directory: witness
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustc --version | grep '^rustc 1.95.0 '
          test "$(bash scripts/cargo.sh -vV | sed -n 's/^host: //p')" = "$NATIVE_TARGET"
      - name: Check packager and build with pinned TLSNotary
        working-directory: witness
        run: |
          python3 -m unittest scripts/test_package_helper.py
          python3 scripts/package_helper.py build --output "$RELEASE_DIR"
      - name: Native Rust and local TLS/MPC checks
        working-directory: witness
        run: |
          bash scripts/cargo.sh test --release --locked --bin allowly-witness-poc
          python3 scripts/execute_demo.py
      - name: Check extracted native executable
        run: |
          extracted="$(mktemp -d)"
          tar -xzf "$RELEASE_DIR/allowly-witness-poc-${GITHUB_REF_NAME#witness-v}-$NATIVE_TARGET.tar.gz" -C "$extracted"
          "$extracted/allowly-witness-poc" --help
          "$extracted/allowly-witness-poc" prove-execute --help
          "$extracted/allowly-witness-poc" verify-execute-attestation --help
      - name: Package source once from the same tag
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: witness
        run: python3 scripts/package_helper.py source --output "$RELEASE_DIR"
      - uses: actions/upload-artifact@v7
        with:
          name: witness-${{ matrix.target }}
          path: ${{ env.RELEASE_DIR }}/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish checked experimental archives
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_DIR: ${{ github.workspace }}/witness/dist
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Recheck release source
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          python3 -c 'import os, sys; sys.path.insert(0, "witness/scripts"); import package_helper as p; p.require_release_source(); assert os.environ["GITHUB_REF_NAME"] == "witness-v" + p.cargo_version()'
      - uses: actions/download-artifact@v8
        with:
          pattern: witness-*
          merge-multiple: true
          path: ${{ env.RELEASE_DIR }}
      - name: Require exactly four native archives and one source archive
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "witness/scripts")
          import package_helper as p
          expected = {f"{p.NAME}-{p.cargo_version()}-{target}.tar.gz" for target in p.TARGETS | {"source"}}
          actual = {path.name for path in Path(os.environ["RELEASE_DIR"]).iterdir()}
          if actual != expected:
              raise SystemExit(f"Release archives differ: missing={expected - actual}, unexpected={actual - expected}")
          PY
      - name: Generate and verify release checksums
        id: manifest
        working-directory: witness
        run: |
          python3 scripts/package_helper.py manifest --output "$RELEASE_DIR"
          python3 scripts/package_helper.py verify --output "$RELEASE_DIR"
          digest="$(sha256sum "$RELEASE_DIR/SHA256SUMS" | cut -d ' ' -f 1)"
          echo "sha256sums_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "SHA256SUMS SHA-256 for the CLI pin: $digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Refuse overwrite and publish prerelease
        # Pass computed data via the environment, not executable shell source.
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.sha256sums_digest }}
        run: |
          release_url="$(gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_DIR"/*.tar.gz "$RELEASE_DIR/SHA256SUMS" LICENSE \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "Experimental Witness helper ${GITHUB_REF_NAME#witness-v}" \
            --notes "Experimental TLSNotary alpha.15 customer helper. Native release checks ran on Ubuntu 22.04 (glibc 2.35) x64/ARM64 and macOS 15 Intel/Apple Silicon. No compatibility below these tested baselines is claimed. Source commit: $GITHUB_SHA. SHA256SUMS SHA-256: $MANIFEST_DIGEST. The standalone LICENSE applies to Allowly adapter source. Pin this checksum manifest independently in the CLI before enabling downloads.")"
          echo "Experimental helper release: $release_url" >> "$GITHUB_STEP_SUMMARY"
