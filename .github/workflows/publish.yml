name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish MCP middleware
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@allowly/mcp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: allowly_mcp
      - uses: actions/checkout@v4
        with:
          repository: Allowly-AI/allowly-sdk-ts
          # ponytail: bootstrap pin; remove after the devDependency uses npm.
          ref: 15469c1cd4b4cd0f6a2967254cf86cc468ffee6a
          path: allowly-sdk-ts
      - name: Require tag commit on main
        working-directory: allowly_mcp
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Build local SDK dependency
        working-directory: allowly-sdk-ts
        run: |
          npm ci
          npm run build
      - name: Install dependencies
        working-directory: allowly_mcp
        run: npm ci
      - name: Typecheck
        working-directory: allowly_mcp
        run: npm run typecheck
      - name: Test
        working-directory: allowly_mcp
        run: npm test
      - name: Check tag matches package version
        working-directory: allowly_mcp
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version"
      - name: Refuse to overwrite published version
        working-directory: allowly_mcp
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published"
            exit 1
          fi
      - name: Publish to npm
        working-directory: allowly_mcp
        run: npm publish --access public
